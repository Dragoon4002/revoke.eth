specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: AgentRegistrar
    network: sepolia
    source:
      address: "0x94CC95937aD2d1Fc8e7D46500553443732049b37"
      abi: AgentRegistrar
      startBlock: 11676355
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AgentDelegation
      abis:
        - name: AgentRegistrar
          file: AgentRegistrar/AgentRegistrar.json
      eventHandlers:
        - event: AgentRegistered(indexed bytes32,indexed address,uint64,uint256)
          handler: handleAgentRegistered
        - event: AgentRevoked(indexed bytes32,uint64)
          handler: handleAgentRevoked
        - event: AgentRenewed(indexed bytes32,uint64)
          handler: handleAgentRenewed
      file: AgentRegistrar/AgentRegistrar.wasm
  - kind: ethereum
    name: CapabilityRegistry
    network: sepolia
    source:
      address: "0xE2867033aa5963a838c85aC2aE3A9452B715750d"
      abi: CapabilityRegistry
      startBlock: 11676355
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Capability
        - PaymentReceipt
      abis:
        - name: CapabilityRegistry
          file: CapabilityRegistry/CapabilityRegistry.json
      eventHandlers:
        - event: CapabilityGranted(indexed bytes32,indexed bytes32,indexed address,uint256,string)
          handler: handleCapabilityGranted
        - event: CapabilityRevoked(indexed bytes32,indexed bytes32,indexed address,uint256)
          handler: handleCapabilityRevoked
        - event: PaymentSettled(indexed bytes32,indexed bytes32,indexed address,uint256,bytes32)
          handler: handlePaymentSettled
      file: AgentRegistrar/AgentRegistrar.wasm
