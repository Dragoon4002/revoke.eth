# Render blueprint — deploys index (:4000-equiv) + settle (:5000-equiv) as public services.
# Both run the whole monorepo via pnpm workspace filter (settle imports @revoke/index in-process).
# Secrets (sync:false) MUST be set in the Render dashboard per service — see VERIFY.md.
#
# Free tier spins DOWN on idle → first request after idle cold-starts (~30-60s). Warm before demo.
services:
  - type: web
    name: revoke-index
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npx --yes pnpm@10.4.0 install --frozen-lockfile
    startCommand: npx --yes pnpm@10.4.0 --filter @revoke/index start
    envVars:
      # Studio query URL (free; 429s under heavy load). Set in dashboard:
      #   https://api.studio.thegraph.com/query/1760021/revoke-ens/v0.0.2
      # Optional gateway path (no rate limit): instead set GRAPH_API_KEY + GRAPH_SUBGRAPH_ID.
      - key: GRAPH_QUERY_URL
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false   # chain-head lookup for provenance freshness

  - type: web
    name: revoke-settle
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npx --yes pnpm@10.4.0 install --frozen-lockfile
    startCommand: npx --yes pnpm@10.4.0 --filter @revoke/settle start
    envVars:
      - key: GRAPH_QUERY_URL
        sync: false   # settle queries the subgraph in-process via @revoke/index
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: HEDERA_TOPIC_ID
        sync: false   # 0.0.10456766
      - key: HEDERA_ACCOUNT_ID
        sync: false   # 0.0.10442951
      - key: HEDERA_PRIVATE_KEY
        sync: false   # ECDSA operator key
      - key: X402_AMOUNT
        sync: false   # optional; defaults 1000000
      - key: X402_TOKEN_ADDRESS
        sync: false   # optional
